name: Structural Workbench reviewer gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: structural-workbench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reviewer-install:
    name: Reviewer install · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Linux on arm64. macos-latest has been arm64 since macos-14, so a
          # fresh install has been proven on that architecture for as long as
          # this matrix has existed -- but only on Darwin, where the wheels a
          # reviewer resolves come from a different set than on Linux. This is
          # the combination `linux_arm64_fresh_install_matrix_passed` in
          # RELEASE_STATUS.json names, and until now nothing ran it.
          #
          # 3.12 only: actions/setup-python's linux-arm64 manifest does not
          # carry every older version, and the question here is whether the
          # distribution installs on the architecture, not on every interpreter.
          - os: ubuntu-24.04-arm
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: One-command reviewer installation
        run: python -m pip install ".[dev]"
      # The install above follows open lower bounds. This records the versions
      # that bound actually resolved, so a later claim about the run can be
      # checked against the job log and the uploaded freeze.
      - name: Record resolved dependency versions
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/resolved-deps"
          {
            python -c 'import platform; print(f"# {platform.system()}/{platform.machine()} CPython {platform.python_version()}")'
            python -m pip freeze
          } | tee "${RUNNER_TEMP}/resolved-deps/pip-freeze.txt"
          {
            echo "### Resolved dependencies"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/resolved-deps/pip-freeze.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload resolved dependency versions
        uses: actions/upload-artifact@v5
        with:
          name: resolved-deps-py${{ matrix.python }}-${{ matrix.os }}
          path: ${{ runner.temp }}/resolved-deps/pip-freeze.txt
          retention-days: 90
      # Names the architecture in the log of every job, so the install-matrix
      # gates are read off recorded evidence instead of inferred from a runner
      # label whose meaning changed once already when macos-latest moved to arm64.
      - name: Record the environment this install was proven on
        run: python -c "import platform,sys; print(f'{platform.system()}/{platform.machine()} py{platform.python_version()}')"
      - name: Documented test runner loads on this interpreter
        run: python tools/run_structural_workbench_tests.py --help
      - name: Product hardening contracts
        run: python -m pytest software/platform/tests/test_product_hardening.py -q
      - name: Suite · Workbench launcher
        run: python -m pytest software/platform/tests/test_workbench_launch.py -q
      - name: Reference context and public research case contracts
        run: |
          python -m pytest software/platform/tests/test_reference_context.py -q
          python -m pytest examples/structural-portfolio/test_public_research_case.py -q
          python -m pytest tools/test_review_candidate.py -q
          python -m pytest tools/test_content_screen.py -q
          python -m pytest software/platform/tests/test_decision_provider.py -q
      - name: Module CLIs answer describe
        run: |
          structqc describe > /dev/null
          memorient describe > /dev/null
          state-atlas describe > /dev/null
          site-context describe > /dev/null
          actstate describe > /dev/null
          assembly-context describe > /dev/null
          sf-csa describe > /dev/null
          structprep describe > /dev/null
          bio-orient describe > /dev/null
      - name: Bundled dependency preflight
        run: python -c "import runpy; runner=runpy.run_path('tools/run_structural_workbench_tests.py'); problems=runner['preflight'](); print(problems); assert not problems"
      - name: Suite · Bio-Orient
        run: python -m pytest software/bio-orient/tests tools/test_distribution_preflight.py -m "not network and not adapter" --tb=short
      # Each suite is its own step so a failure names the suite in the job UI
      # instead of collapsing into one opaque 'exit code 1'. `if: always()` keeps
      # the remaining suites running, so one run reports every failure rather
      # than only the first.
      - name: Suite · StructQC
        run: python -m pytest software/structqc/tests -m "not network and not adapter" --tb=short
      # Cross-platform determinism record for the membrane scope. Prints the
      # fitted half-thickness, normal, and zone assignment on every OS and
      # Python in the matrix, so drift is visible in the log of every run
      # rather than discovered when a qualification panel disagrees.
      # Reference values: d = 9.918221 (macOS arm64), 9.914208 (linux/amd64).
      - name: Record membrane fit geometry
        if: always()
        run: PYTHONPATH="software/membrane-orientor/memorient/tests" python tools/diagnose_membrane_fit.py

      # continue-on-error on both membrane steps, for the reason qualification.yml
      # already gives: collection 2.4 moved membrane orientation to non-blocking,
      # research-only, and a scope the manifest says does not gate the release must
      # not fail the job. This gate was the last place still enforcing it as blocking,
      # which made the two workflows disagree about the same declared scope.
      #
      # This is an alignment, not a relaxation. No threshold moved. Both steps still
      # run, still write their evidence, and still show red on their own -- the job
      # simply stops failing on a scope Mark 1 makes no accuracy claim for.
      #
      # Recording what the bound would have cost, so nobody is tempted later: the
      # failing assertion is test_synthetic_barrel_is_broadly_rotation_invariant at
      # mean Jaccard 0.888 against 0.90. Lowering it would be indefensible. A 12-seed
      # sweep on macOS arm64 gives 0.789 to 0.983 with 6 of 12 below 0.90, so the
      # distribution is continuous -- there is no empty band to put a bound in, unlike
      # the bimodal normal error that justified collection 2.1's 15.0 -> 1.0 revision.
      # The suite's seed=0 draw (0.940) passes by sampling, not by demonstrated
      # invariance. Cause: a perfectly cylindrical barrel has degenerate in-plane axes
      # (lambda2 == lambda3, gap12 = 0.0), so each platform's LAPACK returns a
      # different valid basis and boundary residues flicker. The claim needs
      # withdrawing or restating against a measured distribution; that is open work,
      # not something this flag resolves.
      #
      # Cost of the alignment: an unrelated memorient regression would also stop
      # blocking here. It would still turn this step red, and the qualification
      # workflow still executes the panel, but this gate no longer catches it.
      - name: Record the exact arm64 regression fixture
        if: always()
        continue-on-error: true
        run: python tools/diagnose_membrane_rotation.py --out "${RUNNER_TEMP}/membrane-rotation.json"
      - name: Suite · MembraneOrient
        if: always()
        continue-on-error: true
        run: python -m pytest "software/membrane-orientor/memorient/tests" -m "not network and not adapter" --tb=short
      - name: Organism Orient · synthetic custody and release controls
        run: python -m pytest software/platform/tests/test_membrane_workflow.py software/platform/tests/test_membrane_process_control.py software/structural-workbench/tests/test_membrane_server.py tools/test_membrane_release.py -m "not network and not adapter and not local_data" --tb=short
      - name: Suite · StateAtlas
        if: always()
        run: python -m pytest software/state-atlas/tests -m "not network and not adapter" --tb=short
      - name: Suite · SiteContext
        if: always()
        run: python -m pytest software/site-context/tests -m "not network and not adapter" --tb=short
      - name: Suite · ActState
        if: always()
        run: python -m pytest software/activity-state/tests -m "not network and not adapter" --tb=short
      - name: Suite · AssemblyContext
        if: always()
        run: python -m pytest software/assembly-context/tests -m "not network and not adapter" --tb=short
      - name: Suite · SF-CSA
        if: always()
        run: python -m pytest software/sf-csa/tests -m "not network and not adapter" --tb=short
      - name: Suite · SF-CSA fixture
        if: always()
        run: python -m pytest tools/fixtures/sfcsa -m "not network and not adapter" --tb=short
      # The local application itself: one owner per workspace, honest job states,
      # the localhost request guard, and the build identities the launcher
      # compares. No engine and no case data is involved.
      - name: Suite · Workbench application
        if: always()
        run: python -m pytest software/structural-workbench/tests -m "not network and not adapter" --tb=short
      # Supplied-input GROMACS auditing and bounded pilot diagnostics. The
      # tests use invented non-biological fixtures and mocked engine calls,
      # so they run without GROMACS installed.
      - name: Suite · MD Health
        if: always()
        run: python -m pytest software/md-health/tests -m "not network and not adapter" --tb=short

  workbench:
    name: Workbench contracts, security, and pre-public materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reviewer distribution
        run: python -m pip install ".[dev]"
      - name: Record resolved dependency versions
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/resolved-deps"
          {
            python -c 'import platform; print(f"# {platform.system()}/{platform.machine()} CPython {platform.python_version()}")'
            python -m pip freeze
          } | tee "${RUNNER_TEMP}/resolved-deps/pip-freeze.txt"
          {
            echo "### Resolved dependencies"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/resolved-deps/pip-freeze.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload resolved dependency versions
        uses: actions/upload-artifact@v5
        with:
          name: resolved-deps-workbench-py3.12-ubuntu-latest
          path: ${{ runner.temp }}/resolved-deps/pip-freeze.txt
          retention-days: 90
      - name: Controller, source, report, and contract tests
        run: |
          # This distribution contains only yauvi_platform.structural_workbench,
          # not the private platform's campaign, cell-fate, oral-atlas, or
          # vaccine-orchestration modules. The packaged controller uses only
          # the structural service.
          python -m pytest software/platform/tests/test_structural_workbench.py software/platform/tests/test_qualification_v2.py -m "not network and not adapter" --tb=short
          python -m pytest software/platform/tests/test_biological_case.py -q
          python -m pytest software/sources/tests -m "not network and not adapter" --tb=short
      - name: Showcase bundle parses without a network build
        run: node --check evidence/public-showcase/app.js
      - name: Qualification v2 never claims a qualified scope
        run: |
          set +e
          python evidence/benchmarks/qualification-v2/run_qualification.py
          qualification_code=$?
          set -e
          python - "$qualification_code" <<'PY'
          import json
          import sys
          from pathlib import Path
          results = Path("evidence/benchmarks/qualification-v2/results")
          audit = json.loads((results / "QUALIFICATION_V2_STATUS.json").read_text(encoding="utf-8"))
          # This asserted a bare exit 1 and the literal string
          # "blocked_panel_incomplete". Both are true today and both stop being
          # true the day the last panel is adopted -- the audit would correctly
          # report a composed panel and exit 0, and this gate would fail at the
          # exact moment the project reached its milestone. Assert the contract
          # instead: the exit code reports composition, and nothing here may
          # claim a qualified scope.
          expected = 0 if audit["panel_composition_ready"] else 1
          assert int(sys.argv[1]) == expected, f"exit {sys.argv[1]} disagrees with panel_composition_ready"
          assert audit["scientific_execution_performed"] is False, "the composition audit must not report execution"
          summary = json.loads((results / "EXECUTION_SUMMARY.json").read_text(encoding="utf-8"))
          assert isinstance(summary["all_release_blocking_scopes_qualified"], bool)
          assert summary["second_machine_reproduction"] == "not_recorded"
          PY
      - name: Public showcase and five human use cases reproduce byte-for-byte
        run: |
          python tools/build_five_use_case_showcase.py --replace
          python tools/verify_five_use_case_showcase.py
          python tools/verify_public_showcase.py
          showcase_tmp="$(mktemp -d)"
          python tools/build_five_use_case_showcase.py --out "$showcase_tmp/technical-a" --public-out "$showcase_tmp/public-a"
          python tools/build_five_use_case_showcase.py --out "$showcase_tmp/technical-b" --public-out "$showcase_tmp/public-b"
          diff -qr "$showcase_tmp/technical-a" "$showcase_tmp/technical-b"
          diff -qr "$showcase_tmp/public-a" "$showcase_tmp/public-b"
      - name: CLI reference matches the installed parsers
        run: python tools/build_cli_reference.py --check

      - name: Wheel contains only canonical package namespaces
        run: |
          python -m pytest tools/test_workbench_wheel.py -q
          python -m build --wheel --outdir dist
          python tools/verify_structural_workbench_wheel.py dist/*.whl
      - name: Pre-public JOSS material is internally honest
        run: python tools/verify_structural_joss_staging.py

  paper-figures:
    name: Paper figures · Linux x86_64 · py3.12.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
      # Run ids hash CPython 3.12.3, Linux x86_64, and the numpy, scipy, gemmi,
      # and biopython versions in the constraint file. The open workbench job
      # above installs whatever "3.12" resolves, so this check is separate.
      # freesasa, foldseek, and diamond stay off PATH; the pins record them as
      # unavailable. CA2 acquisition needs network access to RCSB and UniProt.
      - name: Install the pinned figure environment
        run: |
          python -m pip install --constraint yauvi-structural-workbench/docs/requirements-linux-x86_64-py312.txt -e ".[dev]" "matplotlib==3.11.2"
          python -c "import platform; print(f'{platform.system()}/{platform.machine()} CPython {platform.python_version()}')"
      - name: Regenerate public runs and check the paper figures
        run: python tools/build_scientific_figures.py --check

  determinism:
    name: Determinism · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install reviewer distribution
        run: python -m pip install ".[dev]"
      # macos-latest has been arm64 since macos-14. Fail if that label stops
      # meaning arm64, instead of recording an x86_64 run as if it were one.
      - name: Record the architecture this run actually used
        run: python -c "import platform; print(f'{platform.system()}/{platform.machine()} py{platform.python_version()}'); assert platform.system() != 'Darwin' or platform.machine() == 'arm64', platform.machine()"
      # Acquires the hash-locked 2POW, 4RN4, and P00918 files, then runs the
      # public case through StructuralAnalysisStore twice. A hash mismatch
      # stops the job. The upload is the first workspace plus the file hashes.
      - name: Public case twice through the store
        run: python tools/check_determinism.py --out "${RUNNER_TEMP}/determinism-record"
      # upload-artifact skips dotfiles unless asked. The store writes an empty
      # structural_analyses/.operation.lock, and the cross job checks every
      # manifest hash against the uploaded workspace.
      - name: Upload determinism record
        uses: actions/upload-artifact@v5
        with:
          name: determinism-py${{ matrix.python }}-${{ matrix.os }}
          path: ${{ runner.temp }}/determinism-record
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

  determinism-cross:
    name: Determinism · cross-OS and cross-Python
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download per-runner determinism records
        uses: actions/download-artifact@v5
        with:
          pattern: determinism-*
          path: determinism-records
      - name: Diff canonical artifacts across OS and Python
        run: python tools/check_determinism.py --compare determinism-records
