name: Qualification v2 execution

# Executes adopted Qualification v2 strata on every supported platform.
#
# The point is cross-environment reproduction. A stratum that passes only on the
# machine that recorded its expectations is not evidence, so the same locked
# artifacts are acquired and executed on Linux and macOS across three Pythons.
#
# Acquisition uses the network; execution does not. That split is required by
# `execution_policy.network_access: forbidden` in PANEL_MANIFEST.json -- the
# engine never reaches a provider, it reads checksum-verified local files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream artifact drift surfaces on its own rather than in review.
    - cron: "0 7 * * 2"

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  execute:
    name: Adopted panels · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          # A third environment, and the second CPU architecture on Linux.
          #
          # Added as one include rather than a third row of the cross product.
          # The reproduction gate counts *environments* -- platform and machine
          # -- not interpreters, so a full arm64 Python sweep would add three
          # jobs to answer a question one job answers. 3.12 because
          # actions/setup-python's linux-arm64 manifest does not carry every
          # older version.
          #
          # macos-latest has been arm64 since macos-14, so the matrix already
          # spanned two architectures; this makes the Linux/arm64 combination
          # explicit rather than leaving it inferred from a runner label.
          - os: ubuntu-24.04-arm
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the distribution
        run: python -m pip install ".[dev]"

      # assembly-context shells out to the FreeSASA binary, and the panel's
      # gate compares its surface areas against an independent run of the same
      # tool, so the binary must be present. The distribution package suffices:
      # both the module and the check write PDB, and neither needs the mmCIF
      # reader that older builds lack. The version is recorded in every
      # expectation, so a build that disagrees numerically fails the tolerance
      # gate rather than drifting unnoticed.
      - name: Install FreeSASA
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq freesasa
          else
            brew install freesasa
          fi
          freesasa --version | head -1

      - name: Acquire the locked artifacts
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: python acquire_sources.py

      - name: Verify every artifact against the frozen source lock
        id: sources
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: python acquire_sources.py --verify-only

      - name: Execute the StructQC panel offline
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: python run_execution.py --out results/execution-structqc

      - name: Execute the assembly-interface panel offline
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          python run_execution.py \
            --panel ADOPTION_DRAFT_ASSEMBLY.json \
            --out results/execution-assembly

      # The membrane panel is the slowest: memorient runs a rotation series per
      # case, so sixteen cases take roughly six minutes on top of the others.
      #
      # continue-on-error because collection 2.4 moved membrane orientation to
      # non-blocking, research-only, both strata: Mark 1 makes no accuracy claim
      # for it, and eleven of sixteen fitted orientations sit 2.5 to 17.4 degrees
      # from OPM under the collection 2.3 accuracy gate. The runner still
      # executes it, still writes its evidence, and the step still shows red on
      # its own -- but a scope the manifest says does not gate the release must
      # not fail the job. `summarize_execution.py` enforces the same split from
      # `non_blocking_scopes` and is what actually decides this job's outcome.
      - name: Execute the membrane panel offline
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        continue-on-error: true
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          python run_execution.py \
            --panel ADOPTION_DRAFT_MEMBRANE.json \
            --out results/execution-membrane

      - name: Execute the functional-site panel offline
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          python run_execution.py \
            --panel ADOPTION_DRAFT_SITECONTEXT.json \
            --out results/execution-sitecontext

      # ABL executes from its adoption draft, like the panels above: adoption
      # protocol rule 7 wants cross-machine reproduction *before* a stratum is
      # called adopted, so the records stay out of PANEL_MANIFEST.json until this
      # reproduces. state-atlas shells out to nothing, so unlike sf-csa this
      # needs no pinned external runtime.
      - name: Execute the ABL state-atlas panel offline
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          python run_execution.py \
            --panel ADOPTION_DRAFT_ABL.json \
            --out results/execution-abl

      # Reduce this runner's four results to one readable document. On CI this
      # is the interesting artifact: the panels just executed on a machine that
      # did not record the expectations, so the drift deltas it carries are the
      # first cross-machine measurement of the membrane fit's stability.
      #
      # if: always() because a failing panel is exactly when this is worth
      # having. Without it the summary is skipped on the runs that need
      # explaining and the uploaded artifact carries no overview. The script
      # exits 1 when an executed *release-blocking* panel failed, so the job
      # stays red for a failure that gates the release and green for a recorded
      # finding in a research-only scope.
      - name: Summarize the executed evidence
        if: always()
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: python summarize_execution.py

      # The evidence, not just the exit code. Every recorded check -- including
      # the membrane drift deltas, which are informational and therefore cannot
      # be inferred from a green run -- lives in the EXECUTION_STATUS.json files
      # under results/, which go away with the runner. Uploading them is what
      # makes a run's numbers readable afterwards, and the cross-machine drift
      # figures are the reason this matrix exists.
      #
      # Uploaded as one archive rather than as a directory. results/ now holds
      # roughly 790 files, and upload-artifact registers and transfers them
      # individually: on run #46 the CreateArtifact call timed out through all
      # five of its retries on one runner, failing a job whose panels had all
      # passed. One compressed file is a single transfer, and the evidence
      # compresses well because it is JSON and TSV.
      - name: Archive the execution evidence
        if: always()
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          set -euo pipefail
          # work/ is pipeline scratch, excluded from the repository for the same
          # reason it is excluded here: it is not part of the evidence.
          tar --exclude='work' -czf "${RUNNER_TEMP}/execution-evidence.tar.gz" results
          ls -lh "${RUNNER_TEMP}/execution-evidence.tar.gz"

      # continue-on-error because the artifact service is not evidence about the
      # software. summarize_execution.py decides this job's scientific outcome;
      # a transfer that GitHub could not complete should show red on its own step
      # and leave that verdict alone. Same reasoning as the membrane step above.
      - name: Upload the execution evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: execution-evidence-py${{ matrix.python }}-${{ matrix.os }}
          path: ${{ runner.temp }}/execution-evidence.tar.gz
          retention-days: 90

      # Asserted a bare exit 1, which pins CI to an incomplete panel and breaks
      # on the day the last one is adopted. The exit code reports composition,
      # so compare it to the composition state the audit itself recorded.
      - name: Composition audit agrees with its own recorded state
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          set +e
          python run_qualification.py
          code=$?
          set -e
          python - "$code" <<'PY'
          import json
          import sys
          from pathlib import Path
          audit = json.loads(Path("results/QUALIFICATION_V2_STATUS.json").read_text(encoding="utf-8"))
          expected = 0 if audit["panel_composition_ready"] else 1
          assert int(sys.argv[1]) == expected, f"exit {sys.argv[1]} disagrees with panel_composition_ready"
          summary = json.loads(Path("results/EXECUTION_SUMMARY.json").read_text(encoding="utf-8"))
          assert summary["all_release_blocking_scopes_qualified"] is False
          PY

  # Every runner above summarizes itself and hardcodes
  # `second_machine_reproduction: not_recorded`, which from inside one runner is
  # the only honest answer. The matrix then produced six such summaries, uploaded
  # six archives, and nothing combined them -- so the evidence for cross-machine
  # reproduction was generated weekly and read by nobody. That is the same
  # failure summarize_execution.py was written to fix one level down.
  cross-machine:
    name: The matrix agreed with itself
    needs: execute
    # always() so a matrix job that failed still gets its evidence combined. A
    # panel that passed on two environments and failed on a third is exactly the
    # run worth a verdict, and skipping the combiner there would lose it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Runs on the standard library alone, so no install step and nothing that
      # can drift between this job and the evidence it reads.
      - name: Download every runner's evidence
        uses: actions/download-artifact@v5
        with:
          pattern: execution-evidence-*
          path: evidence

      # Exit 1 -- a release-blocking panel disagreed between environments --
      # fails this job, because that is a finding about the software. Exit 2 --
      # too few environments reported -- does not. The uploads above are
      # continue-on-error on purpose (run #46 lost one to a CreateArtifact
      # timeout after every panel had passed), so a transfer GitHub could not
      # complete must not come back as a failed reproduction. Same line
      # source-lock-health.yml draws when a provider is unreachable.
      - name: Combine the per-runner evidence into one verdict
        run: |
          set +e
          python tools/verify_cross_machine_reproduction.py \
            --evidence-dir evidence \
            --json-out "${RUNNER_TEMP}/cross-machine-reproduction.json"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::Too few runner summaries arrived to judge reproduction. \
          Nothing disagreed; the evidence is incomplete."
            exit 0
          fi
          exit "$code"

      - name: Upload the cross-machine verdict
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: cross-machine-reproduction
          path: ${{ runner.temp }}/cross-machine-reproduction.json
          retention-days: 180
