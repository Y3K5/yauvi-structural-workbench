name: Qualification v2 execution

# Executes adopted Qualification v2 strata on every supported platform.
#
# The point is cross-environment reproduction. A stratum that passes only on the
# machine that recorded its expectations is not evidence, so the same locked
# artifacts are acquired and executed on Linux and macOS across three Pythons.
#
# Acquisition uses the network; execution does not. That split is required by
# `execution_policy.network_access: forbidden` in PANEL_MANIFEST.json -- the
# engine never reaches a provider, it reads checksum-verified local files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream artifact drift surfaces on its own rather than in review.
    - cron: "0 7 * * 2"

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  execute:
    name: Adopted panels · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the distribution
        run: python -m pip install ".[dev]"

      # assembly-context shells out to the FreeSASA binary, and the panel's
      # gate compares its surface areas against an independent run of the same
      # tool, so the binary must be present. The distribution package suffices:
      # both the module and the check write PDB, and neither needs the mmCIF
      # reader that older builds lack. The version is recorded in every
      # expectation, so a build that disagrees numerically fails the tolerance
      # gate rather than drifting unnoticed.
      - name: Install FreeSASA
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq freesasa
          else
            brew install freesasa
          fi
          freesasa --version | head -1

      - name: Acquire the locked artifacts
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: python acquire_sources.py

      - name: Verify every artifact against the frozen source lock
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: python acquire_sources.py --verify-only

      - name: Execute the StructQC panel offline
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: python run_execution.py

      - name: Execute the assembly-interface panel offline
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          python run_execution.py \
            --panel ADOPTION_DRAFT_ASSEMBLY.json \
            --out results/execution-assembly

      - name: Execute the functional-site panel offline
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          python run_execution.py \
            --panel ADOPTION_DRAFT_SITECONTEXT.json \
            --out results/execution-sitecontext

      - name: Composition audit still fails closed on the unadopted panels
        working-directory: yauvi-structural-workbench/benchmarks/qualification-v2
        run: |
          set +e
          python run_qualification.py
          code=$?
          set -e
          test "$code" -eq 1
