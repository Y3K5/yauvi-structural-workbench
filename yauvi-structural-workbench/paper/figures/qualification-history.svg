   <g id="text_29">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #a16929" transform="translate(7.2 243.860634)">Six archived runners: four required panels agree; membrane is 5/16 in five and 4/16 in one.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #a16929" transform="translate(7.2 253.938665)">Controls are separate (four per runner). Unexecuted alpha-helical requirements are not shown as tested cases.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #a16929" transform="translate(7.2 264.016696)">Small curated panels do not establish broad biological validity; no combined accuracy score.</text>
   </g>
