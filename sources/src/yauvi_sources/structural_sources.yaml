- source_id: alphafold_db
  display_name: AlphaFold Protein Structure Database
  kind: structure_db
  channel: druggability
  status: proposed
  access: network_download
  what_it_is: AlphaFold Protein Structure Database
  what_we_check: Predicted single-chain coordinates resolved from the current AlphaFold
    API record.; Pairwise confidence values for an AlphaFold prediction.
  hit_means: Source evidence is available for a declared structural analysis; biological
    interpretation remains bounded by the workflow.
  versioning: Record provider release where available and SHA-256 of exact acquired
    bytes. Live accessions are not immutable reference locks.
  license_note: CC BY 4.0.
  limits:
  - Predicted coordinates and confidence are not experimental structure or biochemical
    evidence.
  citations:
  - pmid: '37933859'
    ref: 'Varadi M, Bertoni D, Magana P, et al. AlphaFold Protein Structure Database
      in 2024: providing structure coverage for over 214 million protein sequences.
      Nucleic Acids Res. 2024;52(D1):D368-D375.'
  homepage: https://alphafold.ebi.ac.uk/
  documentation_url: https://alphafold.ebi.ac.uk/api-docs
