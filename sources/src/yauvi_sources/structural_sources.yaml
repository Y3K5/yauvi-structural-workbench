- source_id: diamond
  display_name: DIAMOND
  kind: aligner
  channel: infrastructure
  status: wired
  access: local_binary
  what_it_is: 'A double-indexed, spaced-seed protein aligner — a drop-in BLASTP replacement
    roughly 100-20,000x faster at comparable sensitivity.

    '
  what_we_check: Used only when explicitly selected by the structural workflow.
  hit_means: A method-specific result; no automatic functional transfer.
  versioning: Record exact runtime or data release and input hashes.
  license_note: GPL-3.0.
  limits:
  - '`-k 5` caps hits per query at five; for a large reference panel the best hit
    is kept but the hit distribution is truncated.'
  - Coverage is computed against query length only; a short domain-level hit inside
    a long protein can clear a 50% identity bar at low coverage.
  citations:
  - pmid: '25402007'
    ref: Buchfink B, Xie C, Huson DH. Fast and sensitive protein alignment using DIAMOND.
      Nat Methods. 2015;12(1):59-60.
