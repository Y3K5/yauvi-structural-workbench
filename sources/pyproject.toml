[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yauvi-sources"
version = "0.1.0"
description = "Executable resolver for the YAUVI evidence-source registry: plan, fetch, cache, and verify the raw input files a module declares."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{ name = "Yuvraj Patel" }]

# Deliberately small. The registry loader and the policy engine are stdlib-only;
# `requests` is needed only to actually reach the network, and is an extra so
# that `yauvi-fetch plan` (which never touches the network) installs anywhere.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
fetch = ["requests>=2.28"]
dev = ["pytest>=7", "requests>=2.28"]

[project.scripts]
yauvi-fetch = "yauvi_sources.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yauvi_sources = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "network: exercises a real remote endpoint; deselected by default",
]
