[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yauvi-structural-workbench"
version = "0.1.0.dev0"
description = "Local, evidence-bounded structural protein analysis with deterministic reports and provenance."
readme = "yauvi-structural-workbench/README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Yuvraj Patel"}]
keywords = ["structural bioinformatics", "protein structure", "reproducibility", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.81",
  "requests>=2.28",
  "gemmi>=0.6",
  "numpy>=1.24",
  "PyYAML>=6",
  "scipy>=1.10",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
md = ["MDAnalysis>=2.6"]
source-fetch = ["requests>=2.28"]
dev = ["pytest>=7", "hypothesis>=6.100", "build>=1.2"]
small-molecule = ["meeko>=0.6"]

[project.scripts]
yauvi = "yauvi_structural_workbench.cli:main"
yauvi-fetch = "yauvi_sources.cli:main"
structqc = "structqc.cli:main"
memorient = "memorient.cli:main"
state-atlas = "state_atlas.cli:main"
site-context = "site_context.cli:main"
actstate = "actstate.cli:main"
assembly-context = "assembly_context.cli:main"
sf-csa = "sf_csa.cli:main"
structprep = "structprep.cli:main"
bio-orient = "bio_orient.cli:main"
dockprep = "dockprep.cli:main"
pose-evidence = "pose_evidence.cli:main"
md-health = "md_health.cli:main"

[tool.setuptools.packages.find]
where = [
  "software/structural-workbench/src",
  "software/platform/src",
  "software/sources/src",
  "software/structqc/src",
  "software/membrane-orientor/memorient/src",
  "software/state-atlas/src",
  "software/site-context/src",
  "software/activity-state/src",
  "software/assembly-context/src",
  "software/sf-csa/src",
  "software/structprep/src",
  "software/bio-orient/src",
  "software/dockprep/src",
  "software/pose-evidence/src",
  "software/md-health/src",
]
include = [
  "yauvi_structural_workbench*", "yauvi_platform.structural_workbench*", "yauvi_sources*", "structqc*", "memorient*",
  "state_atlas*", "site_context*", "actstate*", "assembly_context*", "sf_csa*",
  "structprep*", "bio_orient*", "dockprep*", "pose_evidence*",
  "md_health*",
]

[tool.setuptools]
include-package-data = false
license-files = ["yauvi-structural-workbench/LICENSE"]

[tool.setuptools.package-data]
structqc = ["sources.yaml", "py.typed"]
memorient = ["sources.yaml", "membrane_bilayer.js", "viewer_assets/index.html", "viewer_assets/app.js", "viewer_assets/workbench.js", "viewer_assets/3Dmol-min.js", "viewer_assets/3DMOL-LICENSE.txt", "viewer_assets/3Dmol-min.js.LICENSE.txt", "viewer_assets/3DMOL-NOTICE.md", "catalogue/metadata.json"]
state_atlas = ["sources.yaml", "py.typed"]
site_context = ["sources.yaml", "py.typed"]
actstate = ["sources.yaml", "py.typed"]
assembly_context = ["sources.yaml", "py.typed"]
sf_csa = ["sources.yaml", "py.typed"]
dockprep = ["sources.yaml", "py.typed"]
pose_evidence = ["sources.yaml", "py.typed"]
md_health = ["py.typed"]
yauvi_sources = ["py.typed", "structural_sources.yaml"]
yauvi_structural_workbench = ["ui/*", "ui/vendor/*", "examples/*"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not network'"
markers = [
  "local_data: requires separately supplied biological source snapshots; no acquisition",
  "network: requires a live public endpoint and is deselected by default",
  "adapter: requires an optional scientific runtime",
]
